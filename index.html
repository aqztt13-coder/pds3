<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أدوات PDF المتكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1e2433;--mut:#6b7488;--pr:#e5322d;--pr2:#ff7a45;--bd:#e3e7f0;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mut:#9aa3b8;--bd:#2a3145}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2d;--tx:#eef1f8;--mut:#9aa3b8;--bd:#2a3145}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:36px 20px 56px;text-align:center}
header h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px);font-weight:800}
header p{margin:0;opacity:.92}
.wrap{max-width:1000px;margin:-32px auto 40px;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tool{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:18px;cursor:pointer;text-align:right;color:var(--tx);font:inherit;transition:.2s}
.tool:hover{transform:translateY(-3px);border-color:var(--pr);box-shadow:0 8px 22px rgba(229,50,45,.15)}
.tool.on{border-color:var(--pr);background:linear-gradient(var(--card),var(--card)) padding-box}
.tool .ic{font-size:30px}.tool b{display:block;font-size:17px}.tool span{color:var(--mut);font-size:13px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.panel h2{margin:0 0 4px;font-size:22px}.panel>p{margin:0 0 16px;color:var(--mut)}
.drop{border:2.5px dashed var(--pr);border-radius:16px;padding:30px 16px;text-align:center;cursor:pointer;background:rgba(229,50,45,.05);transition:.2s}
.drop.hv{background:rgba(229,50,45,.14)}.drop .ic{font-size:36px}.drop small{color:var(--mut)}
.files{list-style:none;margin:14px 0;padding:0;display:grid;gap:8px}
.files li{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.files .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.files small{color:var(--mut)}
.ib{border:0;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:160px;flex:1}
input[type=text],input[type=number],select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
input[type=range]{width:100%;accent-color:var(--pr)}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;padding:12px 26px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:wait}
.btn.sec{background:var(--ok)}
.msg{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--bd)}
.msg.err{color:#dc2626;border-color:#dc2626}
.res{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--ok);background:rgba(22,163,74,.08)}
.res .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
pre{white-space:pre-wrap;max-height:200px;overflow:auto;background:var(--bg);padding:12px;border-radius:10px;font-family:inherit;font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:.2s}
footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 30px}
</style>
</head>
<body>
<header><h1>📄 أدوات PDF المتكاملة</h1><p>ادمج، قسّم، دوّر، حوّل، واستخرج النص — كل ذلك داخل متصفحك دون رفع ملفاتك لأي خادم</p></header>
<div class="wrap">
<div class="grid" id="grid"></div>
<div class="panel" id="panel"></div>
</div>
<footer>🔒 تتم المعالجة بالكامل على جهازك، ملفاتك تبقى خاصة بك.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const {PDFDocument,degrees,StandardFonts,rgb}=PDFLib;
const $=s=>document.querySelector(s);
const buf=f=>f.arrayBuffer();
const base=f=>f.name.replace(/\.[^.]+$/,'');
const sz=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.ceil(b/1024)+' KB';
const load=async f=>PDFDocument.load(await buf(f),{ignoreEncryption:true});
function range(str,n){ // "1-3,5" -> zero-based indices
  const s=new Set();
  str.split(/[,،\s]+/).filter(Boolean).forEach(p=>{
    const m=p.match(/^(\d+)(?:-(\d+))?$/);if(!m)throw Error('صيغة النطاق غير صحيحة: '+p);
    let a=+m[1],b=+(m[2]||m[1]);if(a>b)[a,b]=[b,a];
    if(a<1||b>n)throw Error('النطاق خارج عدد الصفحات ('+n+')');
    for(let i=a;i<=b;i++)s.add(i-1);
  });
  if(!s.size)throw Error('أدخل أرقام الصفحات');return[...s].sort((a,b)=>a-b);
}
const canvasBlob=c=>new Promise(r=>c.toBlob(r,'image/png'));
async function renderPages(f,scale,cb){
  const pdf=await pdfjsLib.getDocument({data:await buf(f)}).promise,out=[];
  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i),vp=pg.getViewport({scale}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    out.push(await canvasBlob(c));cb&&cb(i/pdf.numPages);
  }return out;
}
const U8=async d=>new Uint8Array(await d.save());
const imgToCanvas=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);URL.revokeObjectURL(u);ok(c)};
  i.onerror=()=>no(Error('تعذّر قراءة الصورة '+f.name));i.src=u});

const TOOLS=[
{id:'merge',ic:'🧩',name:'دمج PDF',desc:'ضم عدة ملفات في ملف واحد',accept:'.pdf',multi:true,min:2,opts:'',
 run:async(fs,o,p)=>{const d=await PDFDocument.create();let k=0;
  for(const f of fs){const s=await load(f);(await d.copyPages(s,s.getPageIndices())).forEach(x=>d.addPage(x));p(++k/fs.length)}
  return[{name:'merged.pdf',data:await U8(d)}]}},
{id:'split',ic:'✂️',name:'تقسيم / استخراج صفحات',desc:'اختر صفحات أو قسّم كل صفحة لملف',accept:'.pdf',
 opts:`<label>الصفحات (مثال: 1-3,5)<input type="text" id="o_r" placeholder="1-3,5"></label>
 <label>الوضع<select id="o_m"><option value="one">ملف واحد بالصفحات المحددة</option><option value="each">كل صفحة في ملف منفصل (ZIP)</option></select></label>`,
 run:async(fs,o,p)=>{const s=await load(fs[0]),n=s.getPageCount();
  if($('#o_m').value==='each'){const z=new JSZip();
   for(let i=0;i<n;i++){const d=await PDFDocument.create();d.addPage((await d.copyPages(s,[i]))[0]);z.file(`page-${i+1}.pdf`,await U8(d));p((i+1)/n)}
   return[{name:base(fs[0])+'-pages.zip',data:await z.generateAsync({type:'blob'})}]}
  const idx=range($('#o_r').value,n),d=await PDFDocument.create();
  (await d.copyPages(s,idx)).forEach(x=>d.addPage(x));
  return[{name:base(fs[0])+'-extract.pdf',data:await U8(d)}]}},
{id:'delete',ic:'🗑️',name:'حذف صفحات',desc:'احذف الصفحات غير المرغوبة',accept:'.pdf',
 opts:`<label>الصفحات المراد حذفها<input type="text" id="o_r" placeholder="2,4-6"></label>`,
 run:async(fs)=>{const s=await load(fs[0]),n=s.getPageCount(),idx=range($('#o_r').value,n);
  if(idx.length>=n)throw Error('لا يمكن حذف كل الصفحات');
  [...idx].reverse().forEach(i=>s.removePage(i));return[{name:base(fs[0])+'-edited.pdf',data:await U8(s)}]}},
{id:'rotate',ic:'🔄',name:'تدوير الصفحات',desc:'دوّر كل الصفحات أو بعضها',accept:'.pdf',
 opts:`<label>الزاوية<select id="o_a"><option value="90">90° مع عقارب الساعة</option><option value="180">180°</option><option value="270">90° عكس عقارب الساعة</option></select></label>
 <label>الصفحات (فارغ = الكل)<input type="text" id="o_r" placeholder="1-3"></label>`,
 run:async(fs)=>{const s=await load(fs[0]),pg=s.getPages(),r=$('#o_r').value.trim(),a=+$('#o_a').value;
  (r?range(r,pg.length):pg.map((_,i)=>i)).forEach(i=>pg[i].setRotation(degrees((pg[i].getRotation().angle+a)%360)));
  return[{name:base(fs[0])+'-rotated.pdf',data:await U8(s)}]}},
{id:'img2pdf',ic:'🖼️',name:'صور إلى PDF',desc:'حوّل صورة أو أكثر إلى ملف PDF',accept:'image/*',multi:true,
 opts:`<label>حجم الصفحة<select id="o_s"><option value="fit">مطابق للصورة</option><option value="a4">A4</option></select></label>`,
 run:async(fs,o,p)=>{const d=await PDFDocument.create();let k=0;
  for(const f of fs){const c=await imgToCanvas(f),b=await canvasBlob(c),im=await d.embedPng(await b.arrayBuffer());
   if($('#o_s').value==='a4'){const W=595,H=842,r=Math.min((W-40)/im.width,(H-40)/im.height),w=im.width*r,h=im.height*r;
    d.addPage([W,H]).drawImage(im,{x:(W-w)/2,y:(H-h)/2,width:w,height:h})}
   else d.addPage([im.width,im.height]).drawImage(im,{x:0,y:0,width:im.width,height:im.height});
   p(++k/fs.length)}
  return[{name:'images.pdf',data:await U8(d)}]}},
{id:'pdf2img',ic:'📸',name:'PDF إلى صور',desc:'حوّل كل صفحة إلى صورة PNG',accept:'.pdf',
 opts:`<label>الدقة<select id="o_q"><option value="1.5">عادية</option><option value="2" selected>عالية</option><option value="3">فائقة</option></select></label>`,
 run:async(fs,o,p)=>{const bl=await renderPages(fs[0],+$('#o_q').value,p);
  if(bl.length===1)return[{name:base(fs[0])+'.png',data:bl[0]}];
  const z=new JSZip();bl.forEach((b,i)=>z.file(`page-${i+1}.png`,b));
  return[{name:base(fs[0])+'-images.zip',data:await z.generateAsync({type:'blob'})}]}},
{id:'text',ic:'📝',name:'استخراج النص',desc:'انسخ نص الملف إلى ملف TXT',accept:'.pdf',
 run:async(fs,o,p)=>{const pdf=await pdfjsLib.getDocument({data:await buf(fs[0])}).promise;let t='';
  for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();
   t+=`--- صفحة ${i} ---\n`+c.items.map(x=>x.str+(x.hasEOL?'\n':'')).join(' ')+'\n\n';p(i/pdf.numPages)}
  window._preview=t.slice(0,1500);
  return[{name:base(fs[0])+'.txt',data:t}]}},
{id:'watermark',ic:'💧',name:'علامة مائية',desc:'أضف نصًا شفافًا فوق الصفحات',accept:'.pdf',
 opts:`<label>النص<input type="text" id="o_t" value="سري"></label>
 <label>الشفافية<input type="range" id="o_p" min="5" max="80" value="25"></label>`,
 run:async(fs,o,p)=>{const txt=$('#o_t').value.trim();if(!txt)throw Error('أدخل نص العلامة');
  const s=await load(fs[0]),c=document.createElement('canvas');c.width=c.height=900;const x=c.getContext('2d');
  x.translate(450,450);x.rotate(-Math.PI/4);x.fillStyle='#888';x.textAlign='center';x.textBaseline='middle';
  let fz=240;x.font=`bold ${fz}px Cairo,Tahoma,Arial`;while(x.measureText(txt).width>1000&&fz>30){fz-=10;x.font=`bold ${fz}px Cairo,Tahoma,Arial`}
  x.fillText(txt,0,0);
  const im=await s.embedPng(await(await canvasBlob(c)).arrayBuffer()),op=$('#o_p').value/100;
  s.getPages().forEach((pg,i,a)=>{const{width:w,height:h}=pg.getSize(),m=Math.min(w,h)*.9;
   pg.drawImage(im,{x:(w-m)/2,y:(h-m)/2,width:m,height:m,opacity:op});p((i+1)/a.length)});
  return[{name:base(fs[0])+'-watermark.pdf',data:await U8(s)}]}},
{id:'numbers',ic:'🔢',name:'ترقيم الصفحات',desc:'أضف أرقام الصفحات تلقائيًا',accept:'.pdf',
 opts:`<label>الموضع<select id="o_pos"><option value="c">أسفل المنتصف</option><option value="l">أسفل اليسار</option><option value="r">أسفل اليمين</option></select></label>
 <label>البدء من<input type="number" id="o_st" value="1" min="0"></label>`,
 run:async(fs)=>{const s=await load(fs[0]),f=await s.embedFont(StandardFonts.Helvetica),n=s.getPageCount(),st=+$('#o_st').value,pos=$('#o_pos').value;
  s.getPages().forEach((pg,i)=>{const{width:w}=pg.getSize(),t=`${i+st} / ${n+st-1}`,tw=f.widthOfTextAtSize(t,11);
   pg.drawText(t,{x:pos==='c'?(w-tw)/2:pos==='l'?30:w-30-tw,y:20,size:11,font:f,color:rgb(.3,.3,.3)})});
  return[{name:base(fs[0])+'-numbered.pdf',data:await U8(s)}]}},
{id:'info',ic:'🛈',name:'بيانات الملف',desc:'اعرض وعدّل العنوان والمؤلف',accept:'.pdf',
 opts:`<label>العنوان<input type="text" id="o_ti"></label><label>المؤلف<input type="text" id="o_au"></label>`,
 run:async(fs)=>{const s=await load(fs[0]);s.setTitle($('#o_ti').value);s.setAuthor($('#o_au').value);
  return[{name:base(fs[0])+'-meta.pdf',data:await U8(s)}]}}
];

let cur=TOOLS[0],files=[];
$('#grid').innerHTML=TOOLS.map(t=>`<button class="tool" data-id="${t.id}"><div class="ic">${t.ic}</div><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
$('#grid').onclick=e=>{const b=e.target.closest('.tool');if(b){pick(b.dataset.id);$('#panel').scrollIntoView({behavior:'smooth'})}};

function pick(id){
  cur=TOOLS.find(t=>t.id===id);files=[];
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  $('#panel').innerHTML=`<h2>${cur.ic} ${cur.name}</h2><p>${cur.desc}</p>
  <div class="drop" id="drop"><div class="ic">⬆️</div><b>اسحب الملفات هنا أو اضغط للاختيار</b><br><small>${cur.accept==='.pdf'?'ملفات PDF':'صور PNG / JPG / WebP'}${cur.multi?' — يمكنك اختيار أكثر من ملف':''}</small>
  <input type="file" id="fi" hidden accept="${cur.accept}" ${cur.multi?'multiple':''}></div>
  <ul class="files" id="fl"></ul><div class="opts">${cur.opts||''}</div>
  <button class="btn" id="go" disabled>▶ تنفيذ</button><div class="bar" id="bar" hidden><i></i></div><div id="out"></div>`;
  const d=$('#drop'),fi=$('#fi');
  d.onclick=()=>fi.click();
  fi.onchange=()=>add([...fi.files]);
  d.ondragover=e=>{e.preventDefault();d.classList.add('hv')};d.ondragleave=()=>d.classList.remove('hv');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('hv');add([...e.dataTransfer.files])};
  $('#go').onclick=run;render();
}
function add(a){
  const ok=cur.accept==='.pdf'?a.filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)):a.filter(f=>f.type.startsWith('image/'));
  files=cur.multi?files.concat(ok):ok.slice(0,1);render();
}
function render(){
  $('#fl').innerHTML=files.map((f,i)=>`<li><span>📄</span><span class="n">${f.name}</span><small>${sz(f.size)}</small>
  ${cur.multi&&files.length>1?`<button class="ib" data-a="u" data-i="${i}">▲</button><button class="ib" data-a="d" data-i="${i}">▼</button>`:''}
  <button class="ib" data-a="x" data-i="${i}">✕</button></li>`).join('');
  $('#go').disabled=files.length<(cur.min||1);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.ib');if(!b||!b.dataset.a)return;
  const i=+b.dataset.i,a=b.dataset.a;
  if(a==='x')files.splice(i,1);
  if(a==='u'&&i>0)[files[i-1],files[i]]=[files[i],files[i-1]];
  if(a==='d'&&i<files.length-1)[files[i+1],files[i]]=[files[i],files[i+1]];
  render();
});
async function save(name,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
async function run(){
  const out=$('#out'),bar=$('#bar'),go=$('#go');
  out.innerHTML='';go.disabled=true;bar.hidden=false;bar.firstChild.style.width='5%';window._preview='';
  try{
    const res=await cur.run(files,{},v=>bar.firstChild.style.width=Math.max(5,v*100)+'%');
    bar.firstChild.style.width='100%';
    out.innerHTML=(window._preview?`<pre>${window._preview.replace(/</g,'&lt;')}</pre>`:'')+
      res.map((r,i)=>`<div class="res"><span>✅</span><span class="n">${r.name}</span><button class="btn sec" data-i="${i}">⬇ تحميل</button></div>`).join('');
    out.querySelectorAll('.btn.sec').forEach(b=>b.onclick=()=>save(res[b.dataset.i].name,res[b.dataset.i].data));
  }catch(e){out.innerHTML=`<div class="msg err">⚠️ ${e.message||'حدث خطأ أثناء المعالجة'}</div>`}
  go.disabled=files.length<(cur.min||1);setTimeout(()=>bar.hidden=true,600);
}
pick('merge');
</script>
</body>
</html>
